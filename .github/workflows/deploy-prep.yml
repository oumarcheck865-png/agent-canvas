name: Deploy Prep

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-prep-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-artifact:
    name: Build production artifact
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "true"
          NEXT_PUBLIC_TELEMETRY_DISABLED: "true"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-canvas-build
          path: |
            .next
            public
            package.json
            pnpm-lock.yaml
            next.config.mjs
          retention-days: 7
